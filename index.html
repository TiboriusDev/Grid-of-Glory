<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid & Glory</title>
    
    <!-- CSS-Datei hier einbinden -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="root">
<h2 class="sr-only">Grid & Glory – 4 Völker, Deckungsbonus, Armeeauswahl, taktisches Rастerspiel.</h2>

<!-- SCREEN 0: MULTIPLAYER LOBBY -->
<div id="screen-lobby">
  <div class="card" style="max-width:400px;">
    <h3 style="font-size:15px;margin-bottom:12px;">⚔️ Grid of Glory</h3>

    <button class="big-btn" id="btn-local" style="background:#185FA5;margin-bottom:8px;">
      🖥️ Lokal spielen (2 Spieler, 1 Gerät)
    </button>

    <button class="big-btn" id="btn-create" style="background:#2d5a1b;margin-bottom:8px;">
      🌐 Online — Raum erstellen
    </button>

    <div style="display:flex;gap:8px;margin-top:4px;">
      <input id="room-input" placeholder="Raum-Code eingeben..."
        style="flex:1;padding:7px;border-radius:var(--radius);border:0.5px solid var(--border-strong);
        background:var(--surface-2);color:var(--text-primary);font-size:13px;">
      <button class="big-btn" id="btn-join"
        style="background:#6b2fa0;width:auto;padding:7px 14px;margin:0;">
        Beitreten
      </button>
    </div>

    <!-- wird angezeigt wenn Raum erstellt -->
    <div id="room-code-display" style="display:none;margin-top:12px;
      background:var(--surface-0);border:0.5px solid var(--border);
      border-radius:8px;padding:10px;text-align:center;">
      <div style="font-size:11px;color:var(--text-secondary);margin-bottom:4px;">
        Raum-Code — schick ihn dem Gegner:
      </div>
      <div id="room-code-text"
        style="font-size:24px;font-weight:700;letter-spacing:4px;"></div>
      <div style="font-size:11px;color:var(--text-secondary);margin-top:4px;">
        Warte auf Spieler 2…
      </div>
    </div>
  </div>
</div>

<!-- SCREEN 1: FACTION PICK -->
<div id="screen-faction">
  <div class="card" style="max-width:500px;">
    <div class="step-label">Schritt 1 von 3 — Volk wählen</div>
    <div style="font-size:12px;color:var(--text-secondary);margin-bottom:10px;">Jedes Team wählt sein Volk. Dann geht's zur Kartenauswahl.</div>
    <div style="font-size:11px;font-weight:500;margin-bottom:6px;" id="faction-pick-label"></div>
    <div class="faction-grid" id="faction-grid"></div>
    <button class="big-btn" id="btn-faction-next" style="background:#185FA5;" disabled>Weiter →</button>
  </div>
</div>

<!-- SCREEN 2: MAP PICK -->
<div id="screen-map" style="display:none;">
  <div class="card" style="max-width:500px;">
    <div class="step-label">Schritt 2 von 3 — Karte wählen</div>
    <div id="map-tabs" style="margin-bottom:10px;"></div>
    <div id="map-content"></div>
    <button class="big-btn" id="btn-map-start" style="background:#185FA5;margin-top:8px;">▶ Spiel starten</button>
  </div>
</div>

<!-- SCREEN 3: GAME -->
<div id="screen-game" style="display:none;">
  <div class="layout">
    <div class="left-col">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <div class="legend-row" id="game-legend"></div>
        <button class="pb" id="btn-back" style="margin-left:auto;">← Neu starten</button>
      </div>
      <div id="board-wrap"></div>
    </div>
    <div class="sidebar">
      <div class="card">
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px;" id="phase-bar"></div>
        <div id="turn-label" style="font-size:12px;font-weight:500;"></div>
      </div>
      <div class="card" id="unit-card"></div>
      <div class="card"><h3>Aktionen</h3><div id="actions"></div></div>
      <div class="card"><h3>Kampflog</h3><div class="log-box" id="log-box"></div></div>
    </div>
  </div>
</div>
</div>
</body>
<!-- Supabase zuerst -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Dann deine Dateien in Abhängigkeitsreihenfolge -->
<script src="js/factions.js"></script>   <!-- keine Abhängigkeiten -->
<script src="js/maps.js"></script>       <!-- braucht nichts -->
<script src="js/game.js"></script>       <!-- braucht factions, maps -->
<script src="js/render.js"></script>     <!-- braucht game -->
<script src="js/multiplayer.js"></script><!-- braucht alles -->

// ── INIT ──
showLobby();
</script>
